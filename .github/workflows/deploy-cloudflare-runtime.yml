name: Deploy WarLike Server runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-runtime.yml'
      - 'app/**'
      - 'lib/**'
      - 'worker/**'
      - 'drizzle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.cloudflare.config.ts'
concurrency:
  group: warlike-server-runtime
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 73c964bff8e0a8220d28a9f3d6abe50d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.25.0'
          run_install: false
      - name: Verify deployment credential exists
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_DEPLOY_TOKEN repository secret'; exit 1; }
      - run: npm run install:ci
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: node node_modules/vite/bin/vite.js build --config vite.cloudflare.config.ts
      - run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config dist/server/wrangler.json
      - run: node --test tests/worker-observability.test.mjs
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/test-suite-runtime.mjs
      - name: Record D1 recovery bookmark before the additive migration
        run: node node_modules/wrangler/bin/wrangler.js d1 time-travel info warlike-server --config dist/server/wrangler.json --json
      - name: Apply Academy and Business schema without resetting existing data
        run: node node_modules/wrangler/bin/wrangler.js d1 execute warlike-server --remote --config dist/server/wrangler.json --file drizzle/0010_suite_app_access.sql --yes
      - name: Verify the target D1 schema
        run: node node_modules/wrangler/bin/wrangler.js d1 execute warlike-server --remote --config dist/server/wrangler.json --command "SELECT operation_id,status FROM app_organization_members LIMIT 0; SELECT operation_id,revision FROM app_drafts LIMIT 0; SELECT token_hash,access_version FROM app_access_sessions LIMIT 0;" --yes
      - name: Deploy private runtime
        run: node node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.json
      - name: Protect request query parameters in logs
        run: node scripts/secure-worker-observability.mjs

