name: Deploy WarLike Online runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-warlike-online.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 73c964bff8e0a8220d28a9f3d6abe50d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Motherlode94/WarLike-Online
          ref: 5a2ba3ab901613a942033a08ae338a447a0edac8
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: node --check public/app.js && node --check worker/src/index.js
      - run: node --test worker/tests/auth.test.mjs
      - run: npx --yes wrangler@4.92.0 deploy --config worker/wrangler.toml --dry-run
      - name: Deploy Online Worker
        run: npx --yes wrangler@4.92.0 deploy --config worker/wrangler.toml
