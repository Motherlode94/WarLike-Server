name: Deploy WarLike Mail runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-warlike-mail.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 73c964bff8e0a8220d28a9f3d6abe50d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Motherlode94/WarLike-Mail
          ref: 9de985420148de3cda6d93a267b5640d81c1dbf3
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '11.25.0'
          run_install: false
      - name: Verify deployment credential exists
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_DEPLOY_TOKEN'; exit 1; }
      - run: npm run install:ci
      - run: node --experimental-strip-types --test tests/warlike-session-client.test.ts tests/mail-view.test.ts tests/pages-proxy.test.mjs
      - run: node node_modules/vite/bin/vite.js build --config vite.cloudflare.config.ts
      - run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config dist/server/wrangler.json
      - name: Deploy private Mail runtime
        run: node node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.json
